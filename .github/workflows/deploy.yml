name: Deploy site

on:
  # push trigger disabled — CI lacks NEXT_PUBLIC_MAPBOX_TOKEN; deploy locally with wrangler
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'Who triggered this deploy'
        required: false
        default: 'manual'
  repository_dispatch:
    types: [deploy]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Sanity images
        run: npm run validate
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}

      - name: Build
        run: |
          # "Set" is not the same as "usable". On 2026-08-08 this secret held a
          # value with a line break in the middle; it passed the old -z test,
          # inlined correctly, and Mapbox answered 401 — the live map read
          # "map unavailable" until it was found. Validate the shape.
          if [ -z "$NEXT_PUBLIC_MAPBOX_TOKEN" ]; then
            echo "❌ NEXT_PUBLIC_MAPBOX_TOKEN secret is not set — map will be broken. Add it in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          if printf '%s' "$NEXT_PUBLIC_MAPBOX_TOKEN" | LC_ALL=C grep -q '[[:space:]]'; then
            echo "❌ NEXT_PUBLIC_MAPBOX_TOKEN contains whitespace (probably pasted line-wrapped)."
            echo "   Re-enter it in GitHub → Settings → Secrets and variables → Actions as ONE unbroken line."
            exit 1
          fi
          if ! printf '%s' "$NEXT_PUBLIC_MAPBOX_TOKEN" | LC_ALL=C grep -Eq '^pk\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'; then
            echo "❌ NEXT_PUBLIC_MAPBOX_TOKEN is not of the form pk.<base64url>.<base64url>."
            exit 1
          fi
          # Ask Mapbox whether it actually works — catches revocation, billing and
          # URL restrictions, none of which a shape check can see.
          MB_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://api.mapbox.com/styles/v1/mapbox/light-v11?access_token=$NEXT_PUBLIC_MAPBOX_TOKEN" || echo 000)
          if [ "$MB_STATUS" = "401" ] || [ "$MB_STATUS" = "403" ]; then
            echo "❌ Mapbox rejected the token (HTTP $MB_STATUS) — revoked, restricted, or billing suspended."
            exit 1
          fi
          if [ "$MB_STATUS" = "000" ]; then
            echo "⚠️  could not reach Mapbox to verify the token — continuing"
          else
            echo "✓ Mapbox token validated (HTTP $MB_STATUS)"
          fi
          # One automatic retry: build-time fetches (Sanity API, etc.) can fail transiently
          # (2026-11-17: Sanity 524, DNS blip, Google Fonts). A second failure is real.
          if ! npm run build; then
            echo "::warning title=Build failed::retrying once in 30s"
            sleep 30
            npm run build
          fi
        env:
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f2a86349fa252c2582bc0f478ccdf9ab

      # Cloudflare Workers Assets sometimes silently returns 404 for large files (>500KB) after
      # marking them as "already uploaded" — the file is in CF's content store but not served.
      # This has broken the museum map twice. Verify large chunks are reachable post-deploy.
      # If this step fails: make a trivial change to components/MuseumMap.tsx, rebuild, redeploy.
      # The zone's cache rule pins HTML at the edge, so a correct deploy can sit behind
      # stale cached pages (2026-11-17: Sanity edits deployed 3x, live stayed stale).
      # Purge BEFORE verifying; --require makes missing secrets a hard failure, not a skip.
      - name: Purge Cloudflare edge cache
        run: node scripts/purge-cache.js --require
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}

      - name: Verify large chunks are accessible
        run: npm run verify-deploy

      # BUILD_ID checks prove the new build is served, not that its CONTENT is. Fetch recently
      # edited profiles from Sanity and fail the run if the live pages don't match.
      - name: Verify live profile and event content matches Sanity
        run: npm run verify-content

      # Runs only when something above failed (after the build retry). Emails info@ through the
      # Gmail API with the same send-only OAuth credentials as the mot-outbox repo; without the
      # GMAIL_* secrets it warns instead of staying silent.
      - name: Alert info@ on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          FAILED_STEP=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name][0] // "unknown"' 2>/dev/null || echo unknown)
          FAILED_STEP="$FAILED_STEP" node scripts/send-alert.js
