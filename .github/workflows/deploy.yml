name: Deploy site

on:
  # push trigger disabled — CI lacks NEXT_PUBLIC_MAPBOX_TOKEN; deploy locally with wrangler
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'Who triggered this deploy'
        required: false
        default: 'manual'
  repository_dispatch:
    types: [deploy]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Sanity images
        run: npm run validate
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}

      - name: Build
        run: |
          # "Set" is not the same as "usable". On 2026-08-08 this secret held a
          # value with a line break in the middle; it passed the old -z test,
          # inlined correctly, and Mapbox answered 401 — the live map read
          # "map unavailable" until it was found. Validate the shape.
          if [ -z "$NEXT_PUBLIC_MAPBOX_TOKEN" ]; then
            echo "❌ NEXT_PUBLIC_MAPBOX_TOKEN secret is not set — map will be broken. Add it in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          if printf '%s' "$NEXT_PUBLIC_MAPBOX_TOKEN" | LC_ALL=C grep -q '[[:space:]]'; then
            echo "❌ NEXT_PUBLIC_MAPBOX_TOKEN contains whitespace (probably pasted line-wrapped)."
            echo "   Re-enter it in GitHub → Settings → Secrets and variables → Actions as ONE unbroken line."
            exit 1
          fi
          if ! printf '%s' "$NEXT_PUBLIC_MAPBOX_TOKEN" | LC_ALL=C grep -Eq '^pk\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'; then
            echo "❌ NEXT_PUBLIC_MAPBOX_TOKEN is not of the form pk.<base64url>.<base64url>."
            exit 1
          fi
          # Ask Mapbox whether it actually works — catches revocation, billing and
          # URL restrictions, none of which a shape check can see.
          MB_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://api.mapbox.com/styles/v1/mapbox/light-v11?access_token=$NEXT_PUBLIC_MAPBOX_TOKEN" || echo 000)
          if [ "$MB_STATUS" = "401" ] || [ "$MB_STATUS" = "403" ]; then
            echo "❌ Mapbox rejected the token (HTTP $MB_STATUS) — revoked, restricted, or billing suspended."
            exit 1
          fi
          if [ "$MB_STATUS" = "000" ]; then
            echo "⚠️  could not reach Mapbox to verify the token — continuing"
          else
            echo "✓ Mapbox token validated (HTTP $MB_STATUS)"
          fi
          npm run build
        env:
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f2a86349fa252c2582bc0f478ccdf9ab

      # Cloudflare Workers Assets sometimes silently returns 404 for large files (>500KB) after
      # marking them as "already uploaded" — the file is in CF's content store but not served.
      # This has broken the museum map twice. Verify large chunks are reachable post-deploy.
      # If this step fails: make a trivial change to components/MuseumMap.tsx, rebuild, redeploy.
      - name: Verify large chunks are accessible
        run: npm run verify-deploy
