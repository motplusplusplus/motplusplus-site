name = "motplusplus-site"
main = "worker.js"
compatibility_date = "2024-09-23"
routes = [
  { pattern = "motplusplusplus.com", custom_domain = true },
  { pattern = "www.motplusplusplus.com", custom_domain = true },
]

[assets]
directory = "out"
binding = "ASSETS"
not_found_handling = "404-page"

# per-ip limit for /api/subscribe and the inquiry newsletter opt-in
[[ratelimits]]
name = "SUBSCRIBE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60

# per-ip limit for /api/correction (worker/correction.js)
[[ratelimits]]
name = "CORRECTION_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 4
  period = 60

# anonymous click counts from /api/t (drift, wall saves, shares, notify-me, inquire).
# Off until Analytics Engine is enabled for the account (one dashboard click:
# Workers & Pages → Analytics Engine → enable). Then uncomment; /api/t no-ops without it.
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "motplus_clicks"
